name: Update Self-Employment Tax rules

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 3'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify law, IRS markers and SSA wage base
        run: python scripts/update_self_employment_tax.py
      - name: Commit verified data / heartbeat
        run: |
          git config user.name "numeros-rules-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add self-employment-tax.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: verify self-employment tax rules"
          git push
