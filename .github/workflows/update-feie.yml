name: Update FEIE rules

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 3'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-feie.yml'
      - 'scripts/update_feie.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify law and IRS rule
        run: python scripts/update_feie.py
      - name: Commit verified data / heartbeat
        run: |
          git config user.name "numeros-rules-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feie.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: verify FEIE rules"
          git push
